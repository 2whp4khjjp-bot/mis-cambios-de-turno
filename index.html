<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6f8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mis Cambios"><title>Mis Cambios de Turno</title><link rel="manifest" href="./manifest.webmanifest">
<style>
:root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#f5f6f8;color:#19212b}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{max-width:540px;margin:auto;padding:22px 16px 40px}header,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}header{margin-bottom:24px}h1{font-size:23px;margin:0}h2{font-size:16px;margin:22px 0 12px}.muted,small{color:#77818d;font-size:13px}.muted{margin:4px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile,.panel{background:#fff;border:1px solid #e7ebee;border-radius:14px;padding:17px}.tile strong{display:block;font-size:32px;margin:6px 0}.positive{color:#17845c}.item{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;gap:10px;padding:13px 0;border:0;border-bottom:1px solid #e5e9ee;background:none;color:inherit;font:inherit;cursor:pointer}.item b{font-size:15px}.badge{border-radius:20px;background:#e5ecf5;color:#325279;padding:5px 8px;font-size:11px;white-space:nowrap}.warn{background:#fff0d9;color:#91600b}.done{background:#e2f4e9;color:#13764d}.secondary{color:#667280}.primary{background:#203c64;color:white;border:0;border-radius:12px;padding:14px 16px;width:100%;font-weight:700;font-size:15px;margin-top:16px;cursor:pointer}.ghost{background:none;border:0;font-size:20px;color:inherit;cursor:pointer;padding:4px 8px}.smallbutton{border:1px solid #dfe4e9;border-radius:9px;background:#fff;padding:9px 10px;color:#283549;font-weight:600;cursor:pointer}.danger{color:#b62e39}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.record{border:1px solid #e5e9ed;border-radius:13px;padding:14px;margin:10px 0;background:#fff}.panel p{font-size:13px;line-height:1.5}.field{display:block;margin:15px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd3dd;border-radius:10px </style></head><body><main id="app"></main><div id="modalRoot"></div><div id="notice"></div><script>
(function(){
"use strict";
var KEY="mis-cambios-v1",records=[],page="home",selected="",editId=null,form={};
function localToday(){var d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function key(s){return String(s).trim().replace(/\s+/g," ").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function fmt(d){return new Date(d+"T12:00:00").toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"numeric"})}
function validDate(d){if(!/^\d{4}-\d\d-\d\d$/.test(d))return false;var x=new Date(d+"T12:00:00");return !isNaN(x)&&x.getFullYear()===Number(d.slice(0,4))&&x.getMonth()+1===Number(d.slice(5,7))&&x.getDate()===Number(d.slice(8,10))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(records))}catch(e){alert("No se pudo guardar. Revisa el almacenamiento del navegador.");return false}return true}
function toast(t){var e=document.getElementById("notice");e.textContent=t;e.style.display="block";clearTimeout(toast.timer);toast.timer=setTimeout(function(){e.style.display="none"},2700)}
function amount(r){return r.status==="realizado"?(r.direction==="mine"?1:-1):0}
function people(){var a=Object.create(null);records.forEach(function(r){var k=key(r.name);if(!a[k])a[k]={key:k,name:r.name,balance:0,accepted:0,rejected:0};a[k].balance+=amount(r);if(r.status==="rechazado")a[k].rejected++;else if(r.direction==="theirs"&&["programado","realizado"].includes(r.status))a[k].accepted++});return Object.values(a).sort(function(a,b){return Number(b.balance!==0)-Number(a.balance!==0)||Math.abs(b.balance)-Math.abs(a.balance)||a.name.localeCompare(b.name,"es")})}
function summary(){return people().reduce(function(a,p){if(p.balance>0)a.owed+=p.balance;if(p.balance<0)a.owe-=p.balance;return a},{owed:0,owe:0})}
function overdue(r){return r.status==="programado"&&r.date<localToday()}
function badge(r){return '<span class="badge '+(overdue(r)?"warn":r.status==="realizado"?"done":"")+'">'+(overdue(r)?"Pendiente de confirmar":r.status==="programado"?"Programado":r.status==="realizado"?"Realizado":r.status==="rechazado"?"Solicitud rechazada":"Anulado")+"</span>"}
function header(t,back){return '<header><div class="row">'+(back?'<button class="ghost" data-action="back" aria-label="Volver">‹</button>':"")+'<div><h1>'+esc(t)+'</h1><div class="muted">'+(back?"Historial de cambios":"Control personal de jornadas")+'</div></div></div>'+(back?"":'<button class="ghost" data-action="settings" aria-label="Ajustes">⚙</button>')+"</header>"}
function home(){var s=summary(),p=people(),pending=records.filter(function(r){return r.status==="programado"}).sort(function(a,b){return Number(overdue(b))-Number(overdue(a))||a.date.localeCompare(b.date)});return header("Mis Cambios",false)+'<div class="grid"><div class="tile"><small>Me deben</small><strong class="positive">'+s.owed+'</strong><small>Jornadas</small></div><div class="tile"><small>Debo</small><strong>'+s.owe+'</strong><small>Jornadas</small></div></div><h2>Cambios programados <small>('+pending.length+')</small></h2>'+(pending.length?pending.map(function(r){return '<button class="item" data-action="edit" data-id="'+esc(r.id)+'"><span><b>'+esc(r.name)+' · '+r.shift+'</b><br><small>'+fmt(r.date)+' · '+(r.direction==="mine"?"Yo por él/ella":"Él/ella por mí")+'</small></span>'+badge(r)+'</button>'}).join(""):'<div class="empty">No hay cambios programados.</div>')+'<h2>Compañeros</h2>'+(p.length?p.map(function(x){return '<button class="item" data-action="person" data-person="'+esc(x.key)+'"><span><b>'+esc(x.name)+'</b><br><small>'+(x.balance>0?"Me debe":x.balance<0?"Le debo":"Compensado")+" · "+x.accepted+" aceptadas · "+x.rejected+" rechazadas"+'</small></span><span><b class="'+(x.balance>0?"positive":"")+'">'+(x.balance>0?"+":"")+x.balance+'</b>　›</span></button>'}).join(""):'<div class="empty">Añade tu primer cambio para comenzar.</div>')+'<button class="primary" data-action="new">＋ Nuevo cambio</button><button class="primary" data-action="newrejected">＋ Solicitud rechazada</button>'}
function recordHTML(r){return '<div class="record"><div class="row"><div><b>'+fmt(r.date)+' · '+r.shift+'</b><br><small>'+(r.status==="rechazado"?"Le pedí que trabajara por mí":r.direction==="mine"?"Yo trabajo por él/ella":"Él/ella trabaja por mí")+'</small></div>'+badge(r)+'</div>'+(r.reason?'<p class="reason"><b>Motivo:</b> '+esc(r.reason)+'</p>':'')+(r.notes?'<p class="reason"><b>Observaciones:</b> '+esc(r.notes)+'</p>':'')+'<div class="actions">'+(r.status==="programado"?'<button class="smallbutton" data-action="complete" data-id="'+esc(r.id)+'">✓ Realizado</button>':"")+'<button class="smallbutton" data-action="edit" data-id="'+esc(r.id)+'">Editar</button>'+(r.status==="rechazado"?'':r.status==="anulado"?'<button class="smallbutton" data-action="reactivate" data-id="'+esc(r.id)+'">Reactivar</button>':'<button class="smallbutton" data-action="annul" data-id="'+esc(r.id)+'">Anular</button>')+'<button class="smallbutton danger" data-action="delete" data-id="'+esc(r.id)+'">Eliminar</button></div></div>'}
function detail(){var rs=records.filter(function(r){return key(r.name)===selected}).sort(function(a,b){return b.date.localeCompare(a.date)}),bal=rs.reduce(function(n,r){return n+amount(r)},0),name=rs[0]?rs[0].name:selected;return header(name,true)+'<div class="tile" style="text-align:center"><strong class="'+(bal>0?"positive":"")+'">'+(bal>0?"+":"")+bal+'</strong><small>'+(bal>0?"Jornadas que me debe":bal<0?"Jornadas que le debo":"Saldo compensado")+'</small></div><p class="hint">Solicitudes a este compañero: '+rs.filter(function(r){return r.direction==="theirs"&&["programado","realizado"].includes(r.status)}).length+' aceptadas · '+rs.filter(function(r){return r.status==="rechazado"}).length+' rechazadas. Los rechazos no afectan al saldo.</p><h2>Historial</h2>'+rs.map(recordHTML).join("")+'<button class="primary" data-action="newperson">＋ Nuevo cambio</button><button class="primary" data-action="newrejected">＋ Solicitud rechazada</button>'}
function settings(){return header("Ajustes",true)+'<div class="panel settings"><b>Almacenamiento local</b><p>Los cambios se guardan automáticamente en este dispositivo. Exporta copias periódicas: los datos del navegador pueden borrarse.</p><button class="primary" data-action="export">↓ Exportar copia JSON</button><button class="smallbutton" data-action="import">↑ Importar copia JSON</button><input id="file" type="file" accept=".json,application/json" hidden><p>Instalación en iPhone: Safari → Compartir → Añadir a pantalla de inicio. Android: Chrome → Instalar aplicación.</p></div>'}
function render(){document.getElementById("app").innerHTML=page==="home"?home():page==="person"?detail():settings()}
function openForm(r,prefill,rejected){editId=r?r.id:null;form=r?Object.assign({},r):{name:prefill||"",date:localToday(),shift:"SOL",direction:rejected?"theirs":"mine",status:rejected?"rechazado":"programado",reason:"",notes:""};renderForm()}
function renderForm(){var future=form.date>localToday(),names=[...new Set(records.map(function(r){return r.name}))];if(future&&form.status==="realizado")form.status="programado";document.getElementById("modalRoot").innerHTML='<div class="modalbg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="formTitle"><div class="modalheader"><h2 id="formTitle">'+(editId?"Editar registro":form.status==="rechazado"?"Solicitud rechazada":"Nuevo cambio")+'</h2><button class="ghost" data-action="close" aria-label="Cerrar">×</button></div><form id="form"><div class="field"><label for="name">Compañero</label><input id="name" name="name" required maxlength="80" autocomplete="off" list="known" value="'+esc(form.name)+'"><datalist id="known">'+names.map(function(n){return '<option value="'+esc(n)+'"></option>'}).join("")+'</datalist></div><div class="field"><label for="date">Fecha</label><input id="date" type="date" name="date" required value="'+esc(form.date)+'"></div><div class="field"><label for="shift">Tipo de jornada</label><select name="shift" id="shift">'+["SOL","LUNA","JN"].map(function(v){return '<option '+(form.shift===v?"selected":"")+'>'+v+'</option>'}).join("")+'</select></div><div class="field"><label for="direction">Quién trabaja</label><select name="direction" id="direction"><option value="mine" '+(form.direction==="mine"?"selected":"")+'>Yo trabajo por él/ella</option><option value="theirs" '+(form.direction==="theirs"?"selected":"")+'>Él/ella trabaja por mí</option></select></div><div class="field"><label for="status">Estado</label><select name="status" id="status"><option value="programado" '+(form.status==="programado"?"selected":"")+'>Programado</option><option value="realizado" '+(form.status==="realizado"?"selected":"")+' '+(future?"disabled":"")+'>Realizado</option><option value="anulado" '+(form.status==="anulado"?"selected":"")+'>Anulado</option><option value="rechazado" '+(form.status==="rechazado"?"selected":"")+'>Solicitud rechazada</option></select><div class="hint">'+(future?"Una fecha futura no puede marcarse Realizado.":"Solo Realizado afecta al saldo. Un rechazo registra una petición tuya al compañero.")+'</div></div><div class="field"><label for="reason">Motivo (opcional)</label><textarea id="reason" name="reason" rows="2" maxlength="2000">'+esc(form.reason)+'</textarea></div><div class="field"><label for="notes">Observaciones (opcional)</label><textarea id="notes" name="notes" rows="2" maxlength="2000">'+esc(form.notes)+'</textarea></div><div class="bar"><button type="button" class="smallbutton" data-action="close">Cancelar</button><button class="primary" style="margin:0" type="submit">Guardar</button></div></form></div></div>'}
function close(){document.getElementById("modalRoot").innerHTML=""}
function changeStatus(id,s){var r=records.find(function(x){return x.id===id});if(!r)return;if(s==="realizado"&&r.date>localToday()){toast("No puedes confirmar una fecha futura");return}r.status=s;if(save()){render();toast("Cambio actualizado")}}
function exportJSON(){var obj={app:"mis-cambios-de-turno",version:1,exportedAt:new Date().toISOString(),records:records},blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="mis-cambios-"+localToday()+".json";a.click();setTimeout(function(){URL.revokeObjectURL(url)},5000)}
function importJSON(file){if(!file||file.size>8e6){alert("Archivo no válido o demasiado grande");return}file.text().then(function(t){var d=JSON.parse(t);if(!d||d.app!=="mis-cambios-de-turno"||d.version!==1||!Array.isArray(d.records)||d.records.length>20000)throw Error("Formato incompatible");var ids=new Set();d.records.forEach(function(r){if(!r||typeof r.id!=="string"||ids.has(r.id)||typeof r.name!=="string"||!r.name.trim()||r.name.length>80||!validDate(r.date)||!["SOL","LUNA","JN"].includes(r.shift)||!["mine","theirs"].includes(r.direction)||!["programado","realizado","anulado","rechazado"].includes(r.status)||["reason","notes"].some(function(k){return r[k]!=null&&(typeof r[k]!=="string"||r[k].length>2000)}))throw Error("Registro inválido");ids.add(r.id)});if(confirm("¿Sustituir los "+records.length+" movimientos actuales por los "+d.records.length+" de la copia?")){var old=records;records=d.records;if(!save())records=old;else{page="home";render();toast("Copia restaurada")}}}).catch(function(e){alert("No se pudo importar: "+e.message)})}
document.addEventListener("click",function(e){var b=e.target.closest("[data-action]");if(!b)return;var a=b.dataset.action,id=b.dataset.id,r=records.find(function(x){return x.id===id});if(a==="back"){page="home";render()}else if(a==="settings"){page="settings";render()}else if(a==="person"){page="person";selected=b.dataset.person;render()}else if(a==="new"){openForm()}else if(a==="newrejected"){openForm(null,page==="person"?(records.find(function(x){return key(x.name)===selected})?.name||selected):"",true)}else if(a==="newperson"){openForm(null,records.find(function(x){return key(x.name)===selected})?.name||selected)}else if(a==="edit"&&r){openForm(r)}else if(a==="close"){close()}else if(a==="complete"){changeStatus(id,"realizado")}else if(a==="annul"){changeStatus(id,"anulado")}else if(a==="reactivate"){changeStatus(id,"programado")}else if(a==="delete"&&r){if(confirm("¿Eliminar definitivamente este cambio?")){records=records.filter(function(x){return x.id!==id});save();render();toast("Cambio eliminado")}}else if(a==="export"){exportJSON()}else if(a==="import"){document.getElementById("file").click()}});
document.addEventListener("change",function(e){if(e.target.id==="date"&&form){form.name=document.getElementById("name").value;form.date=e.target.value;form.shift=document.getElementById("shift").value;form.direction=document.getElementById("direction").value;form.status=document.getElementById("status").value;form.reason=document.getElementById("reason").value;form.notes=document.getElementById("notes").value;renderForm()}if(e.target.id==="file"){importJSON(e.target.files[0]);e.target.value=""}});
document.addEventListener("submit",function(e){if(e.target.id!=="form")return;e.preventDefault();var f=new FormData(e.target),name=String(f.get("name")||"").trim().replace(/\s+/g," "),date=String(f.get("date")||""),shift=String(f.get("shift")||""),direction=String(f.get("direction")||""),status=String(f.get("status")||"programado");if(!name||name.length>80||!validDate(date)||!["SOL","LUNA","JN"].includes(shift)||!["mine","theirs"].includes(direction)){alert("Revisa los datos");return}if(date>localToday()&&status==="realizado")status="programado";if(!["programado","realizado","anulado","rechazado"].includes(status))status="programado";if(status==="rechazado")direction="theirs";var reason=String(f.get("reason")||"").trim(),notes=String(f.get("notes")||"").trim();if(reason.length>2000||notes.length>2000){alert("Texto demasiado largo");return}var previous=records.slice();var old=records.find(function(r){return r.id===editId}),known=records.find(function(r){return key(r.name)===key(name)});if(known)name=known.name;var rec=Object.assign({},old||{},{id:old?old.id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),name:name,date:date,shift:shift,direction:direction,status:status,reason:reason,notes:notes,createdAt:old?old.createdAt:new Date().toISOString()});records=records.filter(function(r){return r.id!==editId});records.push(rec);if(save()){if(page==="person")selected=key(name);close();render();toast("Registro guardado")}else records=previous});
document.addEventListener("change",function(e){if(e.target.id==="status")form.status=e.target.value});
try{var data=JSON.parse(localStorage.getItem(KEY)||"[]");if(Array.isArray(data))records=data}catch(e){records=[]}render();if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("./service-worker.js").catch(function(){});
})();
</script></body></html>
